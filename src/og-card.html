<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("file:///Users/sammcclenaghan/personal-site/public/fonts/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("file:///Users/sammcclenaghan/personal-site/public/fonts/geist-mono-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        /* The site's dark mode. Chosen over white because a near-white card
           reads as a broken or blank image in a dark feed, and #121212 looks
           deliberate in both. */
        background: #121212;
        font-family: "Geist", sans-serif;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow: hidden;
      }
      /* The rail, at 2px rather than 1px: a 1px line scaled to a 300px
         thumbnail disappears entirely. */
      .rail {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 208px;
        width: 2px;
        background: #2c2a27;
      }
      .content {
        position: absolute;
        left: 264px;
        top: 168px;
        right: 96px;
      }
      /* The signature element: the inverted blue block, same as every section
         label on the site. */
      .label {
        display: inline-block;
        background: #93c5fd;
        color: #121212;
        font-family: "Geist Mono", monospace;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.01em;
        padding: 5px 12px;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 40px;
        font-size: 92px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.03em;
        /* The halation-fixed --tx1, not pure white. */
        color: #e8e6e3;
      }
      p {
        margin-top: 28px;
        font-size: 32px;
        line-height: 1.4;
        letter-spacing: -0.01em;
        color: #b3aea6;
        max-width: 740px;
      }
      /* Matches the hairline above the footer. */
      .foot {
        position: absolute;
        left: 264px;
        right: 96px;
        bottom: 96px;
        border-top: 2px solid #2c2a27;
        padding-top: 20px;
        font-family: "Geist Mono", monospace;
        font-size: 24px;
        color: #93c5fd;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="rail"></div>
    <div class="content">
      <span class="label">now</span>
      <h1>Sam McClenaghan</h1>
      <p>Computer science at the University of Victoria.</p>
    </div>
    <div class="foot">smccl.ca</div>
  </body>
</html>
